<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>AutoLog</title>
<style>
:root{--bg:#0b1220;--card:#131c2f;--card2:#1b2740;--tx:#e8eefc;--mu:#8b9bb8;--ac:#22d3ee;--ok:#10b981;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{padding:18px 16px 8px;font-size:22px;font-weight:700}header small{display:block;color:var(--mu);font-size:12px;font-weight:400}
main{padding:8px 14px 110px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.mu{color:var(--mu);font-size:12px}.amt{font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f172a;border-top:1px solid #1e2b45;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 0;font-size:12px}nav button.on{color:var(--ac)}nav b{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#04212a;font-size:30px;box-shadow:0 6px 20px #0008}
.chips{display:flex;gap:8px;margin-bottom:12px}.chips button{flex:1;padding:9px;border-radius:20px;border:1px solid #26365a;background:none;color:var(--mu)}.chips .on{background:var(--ac);color:#04212a;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:20px;font-weight:700;margin-top:4px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
label{display:block;color:var(--mu);font-size:12px;margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #26365a;background:var(--card2);color:var(--tx);font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#04212a;font-weight:700;font-size:16px;margin-top:18px}
.btn.d{background:none;color:var(--bad);margin-top:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick button{background:var(--card2);border:0;color:var(--tx);padding:18px 8px;border-radius:16px;font-size:14px}.pick span{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 4px;text-align:right;border-bottom:1px solid #1e2b45}th{color:var(--mu);font-weight:500}td:first-child,th:first-child{text-align:left}
.badge{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--bad);color:#fff;margin-left:6px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
</style></head><body>
<header id="hd"></header><main id="app"></main>
<button class="fab" onclick="pick()">+</button>
<nav><button data-t="h" class="on"><b>🏠</b>History</button><button data-t="r"><b>⏰</b>Reminders</button><button data-t="p"><b>📊</b>Reports</button></nav>
<div class="sheet" id="sh" onclick="if(event.target===this)closeSh()"><div class="panel" id="pn"></div></div>
<script>
const PAY=['Cash','Credit card','Debit card','Bank transfer','Mobile wallet'];
const T={fuel:{n:'Refueling',i:'⛽',c:'#f59e0b'},service:{n:'Service',i:'🔧',c:'#3b82f6'},expense:{n:'Expense',i:'💸',c:'#ef4444'},income:{n:'Income',i:'💰',c:'#10b981'},reminder:{n:'Reminder',i:'⏰',c:'#8b5cf6'}};
const F={
fuel:[['date','Date & time','dt'],['odo','Odometer (km)','num'],['price','Fuel price / liter','num'],['liters','Liters','num'],['amount','Total cost','num'],['station','Petrol station','text'],['place','Place','text']],
service:[['date','Date & time','dt'],['odo','Odometer (km)','num'],['title','Title','text'],['kind','Type of service','sel',['Oil change','Tyres','Brakes','Battery','General service','Repair','Other']],['amount','Amount','num'],['place','Place','text'],['pay','Payment method','sel',PAY]],
expense:[['date','Date & time','dt'],['odo','Odometer (km)','num'],['kind','Type of expense','sel',['Parking','Toll','Wash','Insurance','Tax / registration','Fine','Accessories','Other']],['amount','Amount','num'],['place','Place','text'],['pay','Payment method','sel',PAY]],
income:[['date','Date & time','dt'],['odo','Odometer (km)','num'],['kind','Type of income','sel',['Ride / Trip','Delivery','Rent','Salary','Other']],['amount','Amount','num'],['pay','Payment method','sel',PAY]],
reminder:[['title','Reminder title','text'],['date','Date & time','dt'],['odo','At odometer (km, optional)','num']]};
let D=JSON.parse(localStorage.getItem('autolog')||'[]'),tab='h',per='monthly',cur=null;
const save=()=>localStorage.setItem('autolog',JSON.stringify(D));
const $=s=>document.querySelector(s),n=v=>parseFloat(v)||0,fm=v=>'Rs '+Math.round(v).toLocaleString();
const nowL=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fd=s=>new Date(s).toLocaleString([], {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const sorted=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date));
const heading=()=>{$('#hd').innerHTML=({h:'History',r:'Reminders',p:'Reports'})[tab]+'<small>AutoLog · your vehicle diary</small>'};

function item(e){const t=T[e.type],isInc=e.type==='income',sub=[e.kind||e.title||e.station,e.place,e.odo?e.odo+' km':''].filter(Boolean).join(' · ');
 const od=e.type==='reminder'&&!e.done&&e.date<nowL()?'<span class="badge">DUE</span>':'';
 return `<div class="card row" onclick="edit('${e.id}')"><div class="ic" style="background:${t.c}33">${t.i}</div><div class="grow"><div>${e.title&&e.type!=='service'?e.title:t.n}${od}</div><div class="mu">${sub||'&nbsp;'}</div><div class="mu">${fd(e.date)}</div></div>${e.amount?`<div class="amt" style="color:${isInc?'var(--ok)':'var(--tx)'}">${isInc?'+':'-'}${fm(e.amount)}</div>`:''}</div>`}

function render(){heading();let h='';
 if(tab==='h'){const a=sorted(D);h=a.length?a.map(item).join(''):'<div class="empty">No entries yet.<br>Tap + to add your first one.</div>'}
 if(tab==='r'){const a=D.filter(e=>e.type==='reminder').sort((x,y)=>x.date.localeCompare(y.date));h=a.length?a.map(item).join(''):'<div class="empty">No reminders.<br>Tap + and choose Reminder.</div>'}
 if(tab==='p')h=report();
 $('#app').innerHTML=h;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}

function inPer(e){const d=nowL();if(per==='lifetime')return true;const l={daily:10,monthly:7,yearly:4}[per];return e.date.slice(0,l)===d.slice(0,l)}
function report(){
 const all=D.filter(e=>e.type!=='reminder'),P=all.filter(inPer);
 const inc=P.filter(e=>e.type==='income').reduce((s,e)=>s+n(e.amount),0);
 const exp=P.filter(e=>e.type!=='income').reduce((s,e)=>s+n(e.amount),0);
 const ods=P.filter(e=>e.odo).map(e=>n(e.odo));let dist=0;
 if(ods.length){const l={daily:10,monthly:7,yearly:4}[per],st=per==='lifetime'?'':nowL().slice(0,l);
  const prev=per==='lifetime'?[]:all.filter(e=>e.odo&&e.date<st).sort((a,b)=>b.date.localeCompare(a.date));
  const base=prev.length?n(prev[0].odo):Math.min(...ods);dist=Math.max(...ods)-base}
 const fu=P.filter(e=>e.type==='fuel').sort((a,b)=>n(a.odo)-n(b.odo)),L=fu.reduce((s,e)=>s+n(e.liters),0),C=fu.reduce((s,e)=>s+n(e.amount),0);
 let eff='–',l100='';if(fu.length>1){const km=n(fu[fu.length-1].odo)-n(fu[0].odo),lit=L-n(fu[0].liters);if(km>0&&lit>0){eff=(km/lit).toFixed(2)+' km/L';l100=(100*lit/km).toFixed(1)+' L/100km'}}
 const all2=D.filter(e=>e.type==='fuel').sort((a,b)=>n(a.odo)-n(b.odo));
 const rows=all2.map((e,i)=>{const p=all2[i-1],km=p?n(e.odo)-n(p.odo):0;return `<tr><td>${e.date.slice(0,10)}</td><td>${e.odo||''}</td><td>${n(e.liters).toFixed(1)}</td><td>${n(e.price).toFixed(0)}</td><td>${km>0?km:'–'}</td><td>${km>0&&e.liters?(km/n(e.liters)).toFixed(1):'–'}</td></tr>`}).reverse().join('');
 const bal=inc-exp;
 return `<div class="chips">${['daily','monthly','yearly','lifetime'].map(p=>`<button class="${p===per?'on':''}" onclick="per='${p}';render()">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div>
 <div class="card"><div class="mu">General ledger · balance</div><div class="big" style="font-size:30px;color:${bal>=0?'var(--ok)':'var(--bad)'}">${bal<0?'-':''}${fm(Math.abs(bal))}</div></div>
 <div class="grid"><div class="card"><div class="mu">Total income</div><div class="big" style="color:var(--ok)">${fm(inc)}</div></div><div class="card"><div class="mu">Total expense</div><div class="big" style="color:var(--bad)">${fm(exp)}</div></div></div>
 <div class="card"><div class="mu">Total distance travelled</div><div class="big">${dist.toLocaleString()} km</div></div>
 <div class="card"><div class="mu" style="margin-bottom:8px">⛽ Refueling</div><div class="grid">
 <div><div class="mu">Total cost</div><div class="big">${fm(C)}</div></div><div><div class="mu">Volume</div><div class="big">${L.toFixed(1)} L</div></div>
 <div><div class="mu">Avg price / L</div><div class="big">${L?fm(C/L):'–'}</div></div><div><div class="mu">Fuel efficiency</div><div class="big">${eff}</div><div class="mu">${l100}</div></div></div></div>
 <div class="card"><div class="mu" style="margin-bottom:6px">Refueling routine (all fill-ups)</div><table><tr><th>Date</th><th>Odo</th><th>Liters</th><th>Rs/L</th><th>Km</th><th>Km/L</th></tr>${rows||'<tr><td colspan=6>No fill-ups yet</td></tr>'}</table></div>
 <div class="card"><div class="mu">Backup</div><button class="btn" style="margin-top:8px;padding:10px" onclick="backup()">Copy data</button><button class="btn" style="margin-top:8px;padding:10px;background:var(--card2);color:var(--tx)" onclick="restore()">Restore data</button></div>`}

function pick(){$('#pn').innerHTML=`<div style="font-weight:700;margin-bottom:12px;font-size:18px">Add new</div><div class="pick">${Object.keys(T).map(k=>`<button onclick="form('${k}')"><span>${T[k].i}</span>${T[k].n}</button>`).join('')}</div>`;$('#sh').classList.add('on')}
function closeSh(){$('#sh').classList.remove('on')}
function edit(id){const e=D.find(x=>x.id===id);form(e.type,e)}
function form(t,e){cur=e||null;const lastOdo=sorted(D.filter(x=>x.odo))[0]?.odo||'';
 const f=F[t].map(([k,l,ty,o])=>{const v=e?e[k]??'':(k==='date'?nowL():'');
  if(ty==='sel')return `<label>${l}</label><select id="f_${k}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  return `<label>${l}</label><input id="f_${k}" type="${ty==='dt'?'datetime-local':ty==='num'?'number':'text'}" ${ty==='num'?'step="any" inputmode="decimal"':''} value="${v}" ${k==='odo'&&!e&&lastOdo?`placeholder="last: ${lastOdo}"`:''} ${['price','liters','amount'].includes(k)&&t==='fuel'?'oninput="calc(this.id)"':''}>`}).join('');
 $('#pn').innerHTML=`<div style="font-weight:700;font-size:18px">${T[t].i} ${e?'Edit':'New'} ${T[t].n}</div>${f}<button class="btn" onclick="saveF('${t}')">Save</button>${e?'<button class="btn d" onclick="del()">Delete</button>':''}`;$('#sh').classList.add('on')}
function calc(id){const p=$('#f_price'),l=$('#f_liters'),a=$('#f_amount');
 if(id!=='f_amount'&&n(p.value)&&n(l.value))a.value=(n(p.value)*n(l.value)).toFixed(2);
 else if(id==='f_amount'&&n(a.value)&&n(p.value)&&id!=='f_liters')l.value=(n(a.value)/n(p.value)).toFixed(2)}
function saveF(t){const o={id:cur?cur.id:String(Date.now()),type:t};
 for(const[k,,ty]of F[t]){const el=$('#f_'+k);o[k]=ty==='num'?(el.value===''?'':n(el.value)):el.value.trim()}
 if(!o.date)return alert('Please set date & time');
 if(t==='reminder'&&!o.title)return alert('Please enter a title');
 if(t!=='reminder'&&!n(o.amount))return alert('Please enter the amount');
 if(cur)D=D.map(x=>x.id===cur.id?{...x,...o}:x);else D.push(o);
 save();closeSh();render()}
function del(){if(confirm('Delete this entry?')){D=D.filter(x=>x.id!==cur.id);save();closeSh();render()}}
function backup(){const s=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Data copied. Paste it into a note/chat to keep it safe.')).catch(()=>prompt('Copy this text:',s))}
function restore(){const s=prompt('Paste your backup data here:');if(!s)return;try{const a=JSON.parse(s);if(!Array.isArray(a))throw 0;D=a;save();render();alert('Restored '+a.length+' entries')}catch(e){alert('Invalid backup data')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script></body></html>
